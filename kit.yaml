# yaml-language-server: $schema=https://raw.githubusercontent.com/dam-agents/dam-starter-kits/main/kit.schema.json
# The starter kit this toolkit is offered as. It lives here, beside the code it
# installs, so a change to the bootstrap and a change to the kit describing it
# are the same commit.
schemaVersion: v1
id: plain-wiki
name: Plain Wiki
description: >-
  A knowledge base agent that keeps markdown files and organizes them for you.
  Lightweight, and works with no network beyond the model.
category: knowledge
icon: document
knowledgeBase:
  shareRoots: [wiki, sources]
# `self` is this repository, at the commit the kit was resolved at, so the
# agent's workspace is always the code this file shipped with.
seed:
  self: true
install:
  command: bash bootstrap.sh
providers: [ibm-litellm, anthropic, openai]
