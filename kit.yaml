# yaml-language-server: $schema=https://raw.githubusercontent.com/dam-agents/dam-starter-kits/main/kit.schema.json
# The starter kit this toolkit is offered as. It lives here, beside the code it
# installs, so a change to the bootstrap and a change to the kit that describes
# it are the same commit. The curated catalog points at this repository; the
# platform resolves it to a commit when it refreshes, and seeds the workspace
# from that same commit because the seed names no ref of its own.
schemaVersion: v1
id: plain-wiki
name: Plain Wiki
description: >-
  A knowledge base agent that keeps markdown files and organizes them for you.
  Lightweight, and works with no network beyond the model.
category: knowledge
icon: document
# The bootstrap below installs this command; the first session runs it.
onboarding: { command: wiki-onboard }
knowledgeBase:
  shareRoots: [wiki, sources]
seed:
  url: https://github.com/dam-agents/plain-wiki
install:
  command: bash bootstrap.sh
providers: [ibm-litellm, anthropic, openai]
